{% extends "auctions/layout.html" %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h2 class="h4 mb-3">Login</h2>
        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}
        <form action="{% url 'login' %}" method="post" class="card card-body shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input autofocus class="form-control" type="text" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <p class="mt-3 mb-0">No account? <a href="{% url 'register' %}">Create one</a>.</p>
    </div>
</div>
{% endblock %}
