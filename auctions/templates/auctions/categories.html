{% extends "auctions/layout.html" %}

{% block title %}Categories{% endblock %}

{% block body %}
<h1 class="h4 mb-3">Categories</h1>
{% if categories %}
    <div class="list-group">
        {% for category in categories %}
            <a href="{% url 'category_listings' category.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                {{ category.name }}
                <span class="badge bg-secondary rounded-pill">{{ category.listings.count }}</span>
            </a>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">No categories yet.</div>
{% endif %}
{% endblock %}
