{% extends "auctions/layout.html" %}

{% block title %}Register{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h2 class="h4 mb-3">Register</h2>
        {% if message %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endif %}
        <form action="{% url 'register' %}" method="post" class="card card-body shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" autofocus type="text" name="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input class="form-control" type="password" name="confirmation" required>
            </div>
            <button class="btn btn-success" type="submit">Create Account</button>
        </form>
        <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a>.</p>
    </div>
</div>
{% endblock %}
