{% extends "auctions/layout.html" %}

{% block title %}Create Listing{% endblock %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 class="h4 mb-3">Create New Listing</h2>
        <form action="{% url 'create_listing' %}" method="post" class="card card-body shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input class="form-control" type="text" name="title" required maxlength="120">
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="4" placeholder="Describe the product"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input class="form-control" type="url" name="image_url" placeholder="https://example.com/image.jpg">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Starting Bid (USD)</label>
                    <input class="form-control" type="number" step="0.01" min="0.01" name="starting_bid" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Category</label>
                    <input class="form-control" list="category-options" name="category" placeholder="e.g. Electronics">
                    <datalist id="category-options">
                        {% for category in categories %}
                            <option value="{{ category.name }}"></option>
                        {% endfor %}
                    </datalist>
                </div>
            </div>
            <button class="btn btn-primary" type="submit">Create Listing</button>
        </form>
    </div>
</div>
{% endblock %}
